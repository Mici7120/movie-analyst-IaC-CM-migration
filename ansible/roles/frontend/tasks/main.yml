---
- name: Install Nginx reverse proxy
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create dedicated system user for movie-analyst-ui
  ansible.builtin.user:
    name: movieapp
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Clone Movie Analyst Frontend repository
  ansible.builtin.git:
    repo: "{{ frontend_repo_url }}"
    dest: "{{ frontend_app_dir }}"
    version: "{{ frontend_repo_version | default('master') }}"
    force: true
  notify: Restart movie-analyst-ui

- name: Ensure application directory ownership
  ansible.builtin.file:
    path: "{{ frontend_app_dir }}"
    owner: movieapp
    group: movieapp
    recurse: true

- name: Install frontend npm dependencies
  ansible.builtin.command:
    cmd: npm install --omit=dev
    chdir: "{{ frontend_app_dir }}"
  become_user: movieapp
  register: npm_install_result
  changed_when: "'added' in npm_install_result.stdout or 'removed' in npm_install_result.stdout"
  notify: Restart movie-analyst-ui

- name: Deploy systemd unit for movie-analyst-ui
  ansible.builtin.template:
    src: movie-analyst-ui.service.j2
    dest: /etc/systemd/system/movie-analyst-ui.service
    mode: "0644"
    owner: root
    group: root
  notify: Restart movie-analyst-ui

- name: Enable and start movie-analyst-ui service
  ansible.builtin.systemd:
    name: movie-analyst-ui
    enabled: true
    state: started
    daemon_reload: true

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure Nginx reverse proxy on port 80
  ansible.builtin.template:
    src: nginx-frontend.conf.j2
    dest: /etc/nginx/sites-available/movie-analyst-ui.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable movie-analyst-ui Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/movie-analyst-ui.conf
    dest: /etc/nginx/sites-enabled/movie-analyst-ui.conf
    state: link
  notify: Reload nginx

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Wait for frontend HTTP port 80 to respond
  ansible.builtin.wait_for:
    port: 80
    host: 127.0.0.1
    timeout: 30
