---
- name: Install MySQL client for database verification and seeding
  ansible.builtin.apt:
    name: mysql-client
    state: present

- name: Create dedicated system user for movie-analyst-api
  ansible.builtin.user:
    name: movieapp
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Clone Movie Analyst Backend repository
  ansible.builtin.git:
    repo: "{{ backend_repo_url }}"
    dest: "{{ backend_app_dir }}"
    version: "{{ backend_repo_version | default('master') }}"
    force: true
  notify: Restart movie-analyst-api

- name: Ensure application directory ownership
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    owner: movieapp
    group: movieapp
    recurse: true

- name: Install backend npm dependencies
  ansible.builtin.command:
    cmd: npm install --omit=dev
    chdir: "{{ backend_app_dir }}"
  become_user: movieapp
  register: npm_install_result
  changed_when: "'added' in npm_install_result.stdout or 'removed' in npm_install_result.stdout"
  notify: Restart movie-analyst-api

- name: Check if database seed SQL exists
  ansible.builtin.stat:
    path: "{{ backend_app_dir }}/data_model/table_creation_and_inserts.sql"
  register: db_seed_file

- name: Seed RDS MySQL database schema (runs once on first backend host)
  ansible.builtin.shell: |
    mysql -h "{{ db_host }}" -P "{{ db_port | default(3306) }}" -u "{{ db_user }}" "{{ db_name }}" < "{{ backend_app_dir }}/data_model/table_creation_and_inserts.sql"
  environment:
    MYSQL_PWD: "{{ db_password }}"
  run_once: true
  when: db_seed_file.stat.exists
  changed_when: false
  no_log: true

- name: Deploy systemd unit for movie-analyst-api
  ansible.builtin.template:
    src: movie-analyst-api.service.j2
    dest: /etc/systemd/system/movie-analyst-api.service
    mode: "0640"
    owner: root
    group: root
  notify: Restart movie-analyst-api

- name: Enable and start movie-analyst-api service
  ansible.builtin.systemd:
    name: movie-analyst-api
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for backend API port to listen
  ansible.builtin.wait_for:
    port: "{{ backend_port | default(3000) }}"
    host: 127.0.0.1
    timeout: 30
